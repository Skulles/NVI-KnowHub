# Пример для основного nginx на shikarno.space, когда KnowHub в Docker слушает 127.0.0.1:8080
# (docker compose: HTTP_PORT=8080, BASE_PATH=/nvi/kh).
#
# Админка:  https://shikarno.space/nvi/kh/admin/
# Контент: https://shikarno.space/nvi/kh/content/manifest.json
# API:     https://shikarno.space/nvi/kh/api/...

upstream knowhub {
    server 127.0.0.1:8080;
    keepalive 8;
}

server {
    listen 443 ssl http2;
    server_name shikarno.space;

    # ssl_certificate ...;
    # ssl_certificate_key ...;

    location /nvi/kh/ {
        proxy_pass http://knowhub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
    }
}
