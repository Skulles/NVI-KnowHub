# KnowHub locations for apps.shikarno.space
# Add inside the existing HTTPS server { server_name apps.shikarno.space; ... } block.
# Do not add a new listen 443 — public HTTPS terminates on xray.

location = /nvi/knowhub {
    return 301 /nvi/knowhub/;
}

location = /nvi/knowhub/admin {
    return 301 /nvi/knowhub/admin/;
}

# Admin SPA — no try_files fallback here: alias + try_files often returns 500.
location /nvi/knowhub/admin/ {
    alias /opt/nvi-knowhub/current/server-stack/admin/dist/;
    index index.html;
}

location /nvi/knowhub/api/ {
    proxy_pass http://127.0.0.1:3000$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    client_max_body_size 50m;
}

location /nvi/knowhub/content/ {
    alias /var/lib/nvi-knowhub/content/;
    add_header Cache-Control "no-cache";
}

location /nvi/knowhub/releases/ {
    alias /var/lib/nvi-knowhub/releases/;
    add_header Cache-Control "no-cache";
}

location /nvi/knowhub/health {
    proxy_pass http://127.0.0.1:3000$request_uri;
}
