# Используйте для локальной разработки:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Или просто запускайте без Docker:
#   cd server && npm run dev
#   cd admin  && npm run dev

services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: build        # остановиться на build-stage (tsx доступен)
    command: npx tsx watch src/index.ts
    working_dir: /build
    environment:
      NODE_ENV: development
      DATA_DIR: /data
      BASE_PATH: ${BASE_PATH:-}
    volumes:
      - ./server/src:/build/src:ro   # hot-reload исходников
      - ./data:/data                  # локальная папка data/
    ports:
      - "3000:3000"                   # прямой доступ к API в dev

  nginx:
    ports:
      - "${HTTP_PORT:-8080}:80"       # dev: порт 8080 чтобы не конфликтовать
